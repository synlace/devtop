# devtop — engine configuration
#
# The engine is artifact-kind-agnostic. This file declares the artifact kinds,
# derivation edges, replan behavior, agent prompts, and the handoff contract
# for external orchestrators. Materialized into $DEVTOP_DIR/config.yml on
# first run so a repo owns its copy (edit, commit, and external tools read it).
#
# The shipped default is intentionally identical to devtop's classic behavior:
# docs (tree nav + MDX) and tickets (board). Adding kinds is a config edit plus
# an engine-supported view — no code change.

artifact_kinds:
  docs:
    path: docs
    extension: .mdx
    agent_writable: true
    view: mdx
    nav:
      label: Docs
      icon: file
      order: 1
      view: tree
    schema:
      title: string
      description: string
      tags: [string]
      derive_prospects: { prds: [eligible, not-eligible] }
      prospect_by: [model, user]
  tickets:
    path: tickets
    extension: .md
    agent_writable: true
    view: board
    nav:
      label: Tickets
      icon: board
      order: 2
      view: board
    schema:
      id: string
      title: string
      status: [open, in-progress, done]
      priority: [urgent, high, medium, low]
      assignee: string?
      claimed_by: string?
      created: date

# ---------------------------------------------------------------------------
# PRDs + derivation: the doc -> prd -> ticket pipeline. The engine computes
# staleness/re-plan generically from the derivation edges.
# ---------------------------------------------------------------------------
  prds:
    path: prds
    extension: .mdx
    agent_writable: true
    requires_approval: true
    view: list
    nav:
      label: PRDs
      icon: doc
      order: 3
      view: list
    schema:
      title: string
      status: [draft, reviewing, approved, archived]
      requirements: [{ id, description, acceptance }]

# ---------------------------------------------------------------------------
# Agents and skills: repo-owned, devtop-consumed. init materializes the
# bundled templates (templates/agents, templates/skills) into .devtop/agents/
# and .devtop/skills/ once; those files, not the templates, are the source of
# truth afterwards. Remove or edit them to change the workflow.
# ---------------------------------------------------------------------------
  agents:
    path: agents
    extension: .mdx
    agent_writable: false
    view: list
    schema:
      title: string
      model: string
      tools: [string]
      skills: [string]
      permissions:
        read: [string]
        write: [string]
  skills:
    path: skills
    extension: .mdx
    agent_writable: false
    view: list
    schema:
      title: string
      description: string
      triggers: [string]

derivation:
  - from: docs
    to: prds
    transform: breakdown
    agent: prd-builder
    classifier: classify-doc
  - from: prds
    to: tickets
    transform: derive_tickets
    agent: ticket-deriver
    gate: "prds.status == approved"

# The cross-kind derivation view. Renders the `derivation` edges above;
# the nav entry is what surfaces it in the UI.
pipeline:
  nav:
    label: Pipeline
    icon: flow
    order: 4
    view: pipeline

# How changed source artifacts affect derived artifacts. Computed generically
# from the derivation edges above.
replan:
  detect: git_diff
  stale_badge: true
  phases:
    before_approval: rederive_draft
    after_approval_pending: mark_stale
    in_flight: delta_only
    shipped: absorb_to_docs

# The AI half — judgment stays in the agent; config declares prompts + triggers.
prompts:
  classify:
    prompt: prompts/classify.md
    default: knowledge

# The embedded chat agent runtime. `default` names a file in .devtop/agents/
# (slug) — the docs agent is scaffolded at init. There is no fallback: if the
# agent file is missing, the chat reports it instead of running with defaults.
agent_runtime:
  default: docs

# The machine-readable contract external orchestrators (ferret, Agent Manager)
# parse to know the artifact vocabulary, which states are grabbable, and how
# results are reported back. devtop never drives the lifecycle.
handoff:
  contract: "tickets/*.md + this config"
  grabbable: []
  report_back:
    - comment
  lifecycle_owner: external
