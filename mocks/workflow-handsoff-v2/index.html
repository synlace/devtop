<script>
// =====================================================================
// Constants
// =====================================================================
const KIND_TEXT = {
  INT: 'text-amber-400', BUG: 'text-rose-400', SPK: 'text-violet-400', RFC: 'text-sky-400',
  CHR: 'text-lime-400', DOC: 'text-blue-400', REQ: 'text-purple-400', DEC: 'text-teal-400',
  OQ: 'text-sky-400', DEV: 'text-slate-300',
}
const REVIEW_STYLE = {
  pending:  'bg-amber-500/10 border-amber-500/25 text-amber-400',
  approved: 'bg-emerald-500/10 border-emerald-500/25 text-emerald-400',
  rejected: 'bg-rose-500/10 border-rose-500/25 text-rose-400',
}
const ACT = 'px-3 py-1.5 rounded-lg text-xs font-medium transition-colors disabled:opacity-60 disabled:cursor-not-allowed'
const codeOf = cat => ({ documentation:'DOC', requirements:'REQ', decisions:'DEC', open_questions:'OQ', tickets:'DEV' }[cat] || cat.toUpperCase().slice(0,3))
const kindName = cat => ({ documentation:'Feature document', requirements:'Requirement', decisions:'Decision', open_questions:'Open question', tickets:'Ticket' }[cat] || cat)
const spin = (size) => `<svg class="w-${size} h-${size} animate-spin text-accentBlue" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path></svg>`
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`

// =====================================================================
// State
// =====================================================================
let items = []
let selectedId = null                 // intent shown in the detail pane
let openChips = new Set()             // expanded artifact ids
let filters = new Set()               // active kind filter codes
let drafts = {}                       // textarea drafts
let qDrafts = {}                      // clarifying question free-text answers
let closedPanels = new Set()          // 'log-{id}' | 'clar-{id}'
let newTitle = ''
let newOpen = false
let activeTab = 'overview'          // detail pane tab: overview | log | clar | art
const timers = new Map()

function countsOf(it) {
  const a = it.artifacts || {}
  return {
    docs: (a.documentation||[]).length,
    reqs: (a.requirements||[]).length,
    decs: (a.decisions||[]).length + (a.open_questions||[]).length,
    tickets: (a.tickets||[]).length,
  }
}
function flatArtifacts(it) {
  const a = it.artifacts || {}
  return [
    it.seed && { id: it.seed.id, cat: it.seedCat, title: it.seed.title, review: it.seed.review, body: it.seed.body, auto: true },
    ...(a.documentation||[]).map(x=>({...x, cat:'documentation'})),
    ...(a.requirements||[]).map(x=>({...x, cat:'requirements'})),
    ...(a.decisions||[]).map(x=>({...x, cat:'decisions'})),
    ...(a.open_questions||[]).map(x=>({...x, cat:'open_questions'})),
    ...(a.tickets||[]).map(x=>({...x, cat:'tickets'})),
  ].filter(Boolean)
}

// =====================================================================
// Script engine
// =====================================================================
const TICK = 1600

function applyStep(it, s) {
  const now = fmt(it.elapsed)
  if (s.t === 'log') {
    it.logs.push({ time: now, cls: s.cls || 'run', text: s.text })
  } else if (s.t === 'stage') {
    it.stage = s.n
    it.logs.push({ time: now, cls: 'run', text: s.label })
  } else if (s.t === 'derive') {
    const cat = s.cat
    it.artifacts[cat] = it.artifacts[cat] || []
    const art = { id: s.art.id, title: s.art.title, body: s.art.body, review: s.art.review || 'approved', req: s.art.req, auto: true }
    if (it.regenerating) art.regen = true
    it.artifacts[cat].push(art)
    it.fresh = art.id
    setTimeout(() => { it.fresh = null; syncArtifacts(it) }, 1600)
    it.logs.push({ time: now, cls: 'derive', text: `derived ${kindName(cat).toLowerCase()} ${art.id} — ${art.title}` })
    it.logs.push({ time: now, cls: 'commit', text: `git commit: ${s.cat === 'tickets' ? 'tickets:' : cat === 'documentation' ? 'docs:' : 'requirements:'} add ${s.art.title.toLowerCase()}` })
  } else if (s.t === 'pause') {
    it.run = 'asking'
    it.waited = 0
    it.question = { q: s.q, ctx: s.ctx, options: s.options, recommended: s.recommended }
    it.tail = it.script.slice(it.scriptIdx + 1)
    it.script = null
    it.checkpoints = it.checkpoints || []
    it.checkpoints.push({
      clarIndex: (it.history || []).length,
      q: s.q, ctx: s.ctx, options: s.options, recommended: s.recommended,
      tail: it.tail,
      artifacts: JSON.parse(JSON.stringify(it.artifacts)),
      logsLen: it.logs.length,
    })
    activeTab = 'clar'
    if (selectedId !== it.id) { selectedId = it.id; renderDetail(); markSelection() }
    it.logs.push({ time: now, cls: 'ask', text: `needs a decision — handed back to the user` })
  } else if (s.t === 'done') {
    it.run = 'done'
    it.stage = 4
    it.published = true
    it.question = null
    it.logs.push({ time: now, cls: 'commit', text: 'git commit: publish work item ' + it.id })
    timers.delete(it.id)
  }
  syncRow(it)
}

function stepRun(it) {
  if (it.run !== 'running' || !it.script) return
  const s = it.script[it.scriptIdx]
  if (!s) {
    it.run = 'done'; it.published = true
    timers.delete(it.id)
    syncRow(it)
    return
  }
  applyStep(it, s)
  it.scriptIdx++
  if (it.run === 'running') {
    timers.set(it.id, setTimeout(() => stepRun(it), s.wait || TICK))
  }
}

function startRun(it) {
  it.run = 'running'; it.stage = 1
  it.scriptIdx = 0
  it.logs = []
  it.artifacts = { documentation:[], requirements:[], decisions:[], open_questions:[], tickets:[] }
  it.question = null; it.tail = null
  it.pauses = it.pauses || 0; it.elapsed = 0; it.waited = 0
  it.logs.push({ time: '00:00', cls: 'run', text: `autonomous run started · seed intents/${it.seed.id}.mdx` })
  render()
  timers.set(it.id, setTimeout(() => stepRun(it), 900))
}

function kickoffSeededRun(it) {
  if (it.run !== 'running' || !it.script) return
  it.scriptIdx = 0
  timers.set(it.id, setTimeout(() => stepRun(it), 900))
}

function resumeRun(it, answer, how) {
  it.pauses = (it.pauses || 0) + 1
  it.history = it.history || []
  it.history.push({ q: it.question.q, answer, how })
  it.logs.push({
    time: fmt(it.elapsed), cls: how === 'default' ? 'ask' : 'derive',
    text: how === 'default'
      ? `continued with the recommended default: "${answer}"`
      : `answered: "${answer}" — run resumed`
  })
  if (it.reanswerPending) {
    it.reanswerPending = false
    it.logs.push({ time: fmt(it.elapsed), cls: 'run', text: 're-generated downstream artifacts after re-answer' })
  }
  it.question = null
  it.run = 'running'
  it.script = it.tail; it.tail = null; it.scriptIdx = 0
  syncRow(it)
  timers.set(it.id, setTimeout(() => stepRun(it), 700))
}
function reAnswer(id, clarIndex) {
  const it = byId(id)
  const ck = it && it.checkpoints && it.checkpoints[clarIndex]
  if (!ck) return
  timers.delete(it.id)
  it.run = 'asking'
  it.waited = 0
  it.script = null
  it.tail = ck.tail
  it.artifacts = JSON.parse(JSON.stringify(ck.artifacts))
  it.logs = it.logs.slice(0, ck.logsLen)
  it.history = it.history.slice(0, ck.clarIndex)
  it.question = { q: ck.q, ctx: ck.ctx, options: ck.options, recommended: ck.recommended }
  it.checkpoints = it.checkpoints.slice(0, clarIndex)
  it.regenerating = true
  it.reanswerPending = true
  renderDetail()
  markSelection()
}
function answer(id, opt) { const it = byId(id); if (!it || it.run !== 'asking') return; resumeRun(it, opt, 'user') }
function answerFreeform(id) {
  const it = byId(id)
  const text = (qDrafts[id] || '').trim()
  if (!it || it.run !== 'asking' || !text) return
  resumeRun(it, text, 'user')
}
function continueDefault(id) { const it = byId(id); if (!it || it.run !== 'asking') return; resumeRun(it, it.question.recommended, 'default') }

// =====================================================================
// Seeds
// =====================================================================
function nextSeq(prefix, floor) {
  nextSeq.n = nextSeq.n || (floor || 100)
  return prefix + nextSeq.n++
}

function seedItems() {
  nextSeq.n = 170
  const running = {
    id: 'WI-017', seedCat: 'intents',
    seed: { id: 'INT-017', title: 'Support custom operators', review: 'approved',
            body: 'Users should be able to register own operators (e.g. modulo, exponent) and reuse them across sessions.' },
    title: 'Custom operators', summary: 'Let users define and reuse their own operators in the calculator.',
    run: 'running', stage: 2, elapsed: 6, pauses: 0, waited: 0,
    artifacts: {
      documentation: [ { id:'DOC-041', title:'Custom operators feature document', review:'approved', auto:true,
        body:'The calculator ships with arithmetic operators only. This document covers a registry of user-defined operators, how definitions are written, and how they persist across sessions.' } ],
      requirements: [ { id:'REQ-041', title:'Register a custom operator', review:'approved', auto:true,
        body:'A user can define an operator with a name, symbol and expression, and it appears in the operator menu immediately.' } ],
      decisions: [], open_questions: [], tickets: [],
    },
    history: [], question: null,
    logs: [
      { time:'00:00', cls:'run', text:'autonomous run started · seed intents/INT-017.mdx' },
      { time:'00:02', cls:'run', text:'read work item + intent' },
      { time:'00:04', cls:'derive', text:'derived documentation DOC-041 — Custom operators feature document' },
      { time:'00:05', cls:'commit', text:'git commit: docs: add custom operators feature document' },
      { time:'00:06', cls:'derive', text:'derived requirement REQ-041 — Register a custom operator' },
    ],
    script: [
      { t:'log', cls:'commit', text:'git commit: requirements: add operator registry requirement' },
      { t:'derive', cat:'decisions', art:{ id:'DEC-011', title:'Store definitions in local storage',
        body:'User definitions live in local storage so custom operators survive reloads without a backend.' } },
      { t:'derive', cat:'open_questions', art:{ id:'OQ-008', title:'Should operators support recursion?',
        body:'A definition may reference previously defined operators. Limit recursion depth for this iteration.' } },
      { t:'log', cls:'commit', text:'git commit: requirements: derive decisions and open questions' },
      { t:'stage', n:3, label:'deriving tickets' },
      { t:'derive', cat:'tickets', art:{ id:'DEV-171', title:'Implement operator registry', req:'REQ-041', body:'Model definitions, CRUD, and persistence in local storage.' } },
      { t:'derive', cat:'tickets', art:{ id:'DEV-172', title:'Operator expression evaluator', req:'REQ-041', body:'Parse and evaluate user expressions with bounded recursion.' } },
      { t:'log', cls:'commit', text:'git commit: tickets: add operator implementation tickets' },
      { t:'stage', n:4, label:'run complete' },
      { t:'done' },
    ],
  }
  const asking = {
    id: 'WI-015', seedCat: 'intents',
    seed: { id: 'INT-015', title: 'Dark mode across the app', review: 'approved',
            body: 'Users should be able to switch the app to a dark theme, with the choice remembered across sessions.' },
    title: 'Dark mode', summary: 'Theme switching with a remembered preference.',
    run: 'asking', stage: 2, elapsed: 9, pauses: 0, waited: 14,
    question: {
      q: 'Should the app follow the system theme by default?',
      ctx: 'asked while deriving requirements · from documentation/dark-mode.mdx',
      options: ['Follow system theme (recommended)', 'Always dark by default', 'Light until the user enables dark'],
      recommended: 'Follow system theme',
    },
    tail: [
      { t:'derive', cat:'open_questions', art:{ id:'OQ-006', title:'Persist the choice per device?',
        body:'Follow-system needs a local override store so a user can pin one theme per device.' } },
      { t:'log', cls:'commit', text:'git commit: requirements: add open question' },
      { t:'stage', n:3, label:'deriving tickets' },
      { t:'derive', cat:'tickets', art:{ id:'DEV-130', title:'Theme toggle in the header', req:'REQ-030',
        body:'Render the toggle and flip the palette classes immediately.' } },
      { t:'derive', cat:'tickets', art:{ id:'DEV-131', title:'Persist the theme choice', req:'REQ-031',
        body:'Save the resolved theme and restore it on boot, honoring the default.' } },
      { t:'log', cls:'commit', text:'git commit: tickets: add theme tickets' },
      { t:'stage', n:4, label:'run complete' }, { t:'done' },
    ],
    script: null,
    artifacts: {
      documentation: [ { id:'DOC-030', title:'Dark mode feature document', review:'approved', auto:true,
        body:'The app currently ships a single light theme. This document covers a dark palette, how the user switches themes, and how the chosen theme persists across sessions.' } ],
      requirements: [
        { id:'REQ-030', title:'Switch between light and dark themes', review:'approved', auto:true,
          body:'A theme toggle in the header flips the app between light and dark palettes immediately.' },
        { id:'REQ-031', title:'Remember the theme choice', review:'approved', auto:true,
          body:'The last chosen theme persists across sessions, with a default applied on first run.' },

      const on = it.stage > sc.n || (it.run === 'done' && sc.n === 3)

function togglePanel(kind, id) {
  const key = kind + '-' + id

  if (!wrap) return
  const chev = wrap.querySelector('[data-panel-chev]')
  const body = wrap.querySelector('[data-panel-body]')
  if (chev) chev.classList.toggle('-rotate-90', closedPanels.has(key))
  if (body) body.classList.toggle('hidden', closedPanels.has(key))
}

        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[10px] uppercase tracking-wider font-semibold"><span class="${KIND_TEXT[codeOf(a.cat)] || 'text-slate-500'}">${codeOf(a.cat)}</span><span class="text-slate-500 ml-1">· ${kindName(a.cat)}</span></span>
          <button onclick="event.stopPropagation();toggleEdit('${it.id}','${a.id}')" class="p-1 rounded-md border border-borderDark text-slate-500 hover:text-slate-200 transition-colors">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4H4a1 1 0 00-1 1v14a1 1 0 001 1h14a1 1 0 001-1v-7M18.5 2.5a2.1 2.1 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
        </div>
        ${openChips.has('edit:'+a.id) ? `
          <textarea id="artedit-${a.id}" oninput="drafts['${a.id}']=this.value" class="w-full min-h-[90px] resize-y rounded-lg border border-borderDark bg-[#0b1220] p-2 text-xs text-slate-200 focus:outline-none focus:border-accentBlue/60">${drafts[a.id] !== undefined ? drafts[a.id] : a.body}</textarea>
          <div class="flex justify-end gap-2 mt-1.5">
            <button onclick="toggleEdit('${it.id}','${a.id}')" class="${ACT} border border-borderDark text-slate-300 hover:bg-borderDark/20">Cancel</button>
            <button onclick="saveEdit('${it.id}','${a.id}')" class="${ACT} bg-accentBlue text-white hover:bg-accentBlue/80">Save — re-derive dependents</button>
          </div>`
        : `<p class="text-xs text-slate-400 leading-relaxed whitespace-pre-wrap">${a.body || '—'}</p>`}
      </div>` : ''}
    </div>`
  }).join('')
  return `
  <div class="rounded-lg border border-borderDark/40 bg-surfaceDark/20 p-3">
    ${pills}
    ${rows || '<p class="text-xs text-slate-600 p-2">No artifacts derived yet — they appear here as the run advances.</p>'}
    <div class="flex items-center justify-between pt-1.5 text-[10px] text-slate-600">
      <span>${filters.size ? `Showing ${filtered.length} of ${fl.length} artifacts` : fl.length + ' artifacts'}</span>
      <span class="italic">auto-approval can be overridden inline — the run then re-derives dependents</span>
    </div>
  </div>`
}

function idleBlock(it) {
  return `
    <div class="flex items-center justify-between rounded-lg border border-borderDark/40 bg-surfaceDark/20 px-4 py-3">
      <div class="text-[11px] text-slate-500">Captured but not yet handed to the workflow. Once started, it runs hands-off and pauses only if it needs a decision.</div>
      <button onclick="sendIdleToRun('${it.id}')" class="${ACT} bg-accentBlue text-white hover:bg-accentBlue/80 inline-flex items-center gap-1.5 flex-shrink-0">
        ${spin(2.5)}Start autonomous run</button>
    </div>`
}

// =====================================================================
// Work items list
// =====================================================================
function listRow(it) {
  const c = countsOf(it)
  const sel = selectedId === it.id
  return `
  <div data-row="${it.id}" onclick="setSelected('${it.id}')"
    class="border-b border-borderDark last:border-b-0 px-3 py-2.5 cursor-pointer select-none hover:bg-white/5 transition-colors ${sel ? 'bg-accentBlue/10' : ''} ${it.run === 'asking' ? 'bg-amber-500/[0.04]' : ''}">
    <div class="list-row gap-3 items-center">
      <div class="flex items-center gap-2 font-mono text-xs text-slate-400">
        ${stateDot(it)}
        <span>${it.id}</span>
      </div>
      <div class="text-sm font-medium text-slate-100 truncate min-w-0">${it.title}</div>
      <div class="list-col-count text-xs text-slate-400" id="cnt-${it.id}-docs">${c.docs}</div>
      <div class="list-col-count text-xs text-slate-400" id="cnt-${it.id}-reqs">${c.reqs}</div>
      <div class="list-col-count text-xs text-slate-400" id="cnt-${it.id}-decs">${c.decs}</div>
      <div class="list-col-count text-xs text-slate-400" id="cnt-${it.id}-tickets">${c.tickets}</div>
      <div class="flex items-center justify-end gap-2" onclick="event.stopPropagation()"><span id="pill-${it.id}">${runStatePill(it)}</span></div>
    </div>
  </div>`
}

function renderList() {
  document.getElementById('listTitle').textContent = 'All intents'
  document.getElementById('listSubtitle').textContent = 'Select an intent to inspect its run in the detail pane.'
  document.getElementById('list').innerHTML = `
    <div class="rounded-xl border border-borderDark/60 overflow-hidden bg-[#0b1220]/50">
      <div class="list-head gap-3 items-center px-3 py-2 bg-slate-800/40 border-b border-borderDark text-[10px] uppercase tracking-wider text-slate-500 font-semibold">
        <span>Intent</span><span>Title</span><span class="list-col-count">Docs</span><span class="list-col-count">Reqs</span><span class="list-col-count">Decis</span><span class="list-col-count">Ticks</span><span class="text-right">State</span>
      </div>
      ${items.map(listRow).join('') || '<p class="text-xs text-slate-600 p-6 text-center">No intents yet — capture one below.</p>'}
    </div>`
  markSelection()
}

function captureForm() {
  return `
  <form onsubmit="event.preventDefault();startNewWorkItem()" class="flex items-center gap-2 px-3 py-2.5 mt-3 rounded-xl border border-dashed border-slate-700">
    <button type="button" onclick="newOpen=!newOpen;render()" class="text-[13px] text-accentBlue hover:underline font-medium flex-shrink-0">${newOpen ? 'Cancel' : '+ Capture new intent'}</button>
    ${newOpen ? `
      <input autofocus oninput="newTitle=this.value;this.form.querySelector('[type=submit]').disabled=!this.value.trim()" value="${newTitle}" onkeydown="if(event.key==='Enter'){event.preventDefault();startNewWorkItem()}"
        class="flex-1 min-w-0 px-2.5 py-1.5 rounded-lg bg-[#0b1220] border border-borderDark text-sm text-slate-200 placeholder:text-slate-600 focus:outline-none focus:border-accentBlue/60"
        placeholder="Title (the seed of a work item)…">
      <button type="submit" class="${ACT} bg-accentBlue text-white hover:bg-accentBlue/80" ${newTitle.trim() ? '' : 'disabled'}>Capture &amp; run</button>` : ''}
  </form>`
}

function bannerChips() {
  const nRun = items.filter(i => i.run === 'running').length
  const nAsk = items.filter(i => i.run === 'asking').length
  const nDone = items.filter(i => i.run === 'done').length
  const chip = (cls, dot, txt) => `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[10px] font-medium border ${cls}"><span class="w-1.5 h-1.5 rounded-full ${dot}"></span>${txt}</span>`
  return chip(nRun ? 'border-accentBlue/40 bg-accentBlue/10 text-slate-200' : 'border-borderDark text-slate-500', nRun ? 'bg-accentBlue' : 'bg-slate-600', `${nRun} running`) +
    chip(nAsk ? 'border-amber-500/40 bg-amber-500/10 text-amber-300' : 'border-borderDark text-slate-500', nAsk ? 'bg-amber-400' : 'bg-slate-600', `${nAsk} waiting`) +
    chip(nDone ? 'border-emerald-500/40 bg-emerald-500/10 text-emerald-300' : 'border-borderDark text-slate-500', nDone ? 'bg-emerald-400' : 'bg-slate-600', `${nDone} hands-off`)
}

// =====================================================================
// Detail pane
// =====================================================================
function detailHtml() {
  const it = byId(selectedId)
  if (!it) return `
    <div class="h-full flex flex-col items-center justify-center px-8 text-center">
      <svg class="w-10 h-10 text-slate-700 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
      <p class="text-sm font-medium text-slate-400">No intent selected</p>
      <p class="text-[11px] text-slate-600 mt-1 max-w-[220px]">Select an intent in the list to inspect its run, log and artifacts here.</p>
    </div>`
  return `
  <div class="border-b border-borderDark/30 flex items-center flex-shrink-0">
    <div id="tabs-${it.id}" class="flex-1 min-w-0 pt-1">${tabBar(it)}</div>
    <div class="flex items-center gap-0.5 pr-2 pb-1.5 flex-shrink-0">
      <button id="detailFullBtn" onclick="toggleDetailFull()" title="${detailFull ? 'Exit fullscreen' : 'Fullscreen detail'}"
        class="w-7 h-7 rounded-md grid place-items-center text-slate-500 hover:text-slate-200 hover:bg-borderDark/30 transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${detailFull ? 'M9 17H5v-4M15 7h4v4M7 7l10 10' : 'M8 4h12v12M4 10V8a4 4 0 014-4h2M16 20h-2M20 12v4a4 4 0 01-4 4h-2M4 8v4a4 4 0 004 4h2M16 4v4a4 4 0 01-4 4h-4'}"/></svg>
      </button>
      <button onclick="setSelected(null)" title="Close" class="w-7 h-7 rounded-md grid place-items-center text-slate-500 hover:text-slate-200 hover:bg-borderDark/30 transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  <div class="px-4 pb-8">
    <div class="py-3 border-b border-borderDark/20">
      <div class="flex items-center gap-2.5">
        <span class="${KIND_TEXT.INT} font-mono text-[10px] font-semibold flex-shrink-0">${it.seed.id} · Intent</span>
        <span class="text-[10px] text-slate-600 flex-shrink-0">${kindName(it.seedCat)}</span>
        <h2 class="text-base font-semibold text-slate-100 leading-tight min-w-0 truncate flex-1">${it.title}</h2>
        <span class="flex-shrink-0" id="detailPill">${runStatePill(it)}</span>
      </div>
      <p class="text-[11px] text-slate-500 mt-1">${it.summary || ''}</p>
    </div>
    <div class="space-y-3 mt-3">
      <section id="tab-overview-${it.id}" class="${activeTab === 'overview' ? '' : 'hidden'} space-y-3">
        <div id="overview-${it.id}">
          ${it.run === 'idle'
            ? idleBlock(it)
            : `<div class="text-[9px] uppercase tracking-[0.18em] font-bold text-slate-500 mb-1.5">Derivation run</div>
               ${stageRail(it)}`}
        </div>
        <div id="artifacts-${it.id}">${artifactRows(it)}</div>
      </section>
      <section id="tab-log-${it.id}" class="${activeTab === 'log' ? '' : 'hidden'}">${logPanel(it)}</section>
      <section id="tab-clar-${it.id}" class="${activeTab === 'clar' ? '' : 'hidden'} space-y-2">
        <div id="ask-${it.id}" class="${it.run === 'asking' ? '' : 'hidden'}">${it.run === 'asking' ? questionCard(it) : ''}</div>
        ${clarPanel(it)}
      </section>
    </div>
  </div>`
}

function renderDetail() {
  document.getElementById('detail').innerHTML = detailHtml()
  const it = byId(selectedId)
  if (it) it.rendered = it.logs.length
  const pane = document.getElementById('detail')
  pane.scrollTop = 0
  markSelection()
}

function markSelection() {
  for (const it of items) {
    const row = document.querySelector(`[data-row="${it.id}"]`)
    if (row) row.classList.toggle('bg-accentBlue/10', selectedId === it.id)
  }
}

function setSelected(id) {
  if (selectedId === id) { selectedId = null } else { selectedId = id; activeTab = 'overview' }
  renderDetail()
  renderList()
}

// =====================================================================
// Full render
// =====================================================================
function render() {
  document.getElementById('bannerChips').innerHTML = bannerChips()
  renderList()
  renderDetail()
  document.getElementById('capture').innerHTML = captureForm()
}

// =====================================================================
// Targeted sync (script steps — no full re-render)
// =====================================================================
function syncLogs(it) {
  const el = document.getElementById('loglist-' + it.id)
  if (!el) return
  const done = it.rendered || 0
  const tail = it.logs.slice(done)
  if (tail.length) el.insertAdjacentHTML('beforeend', tail.map(lineHtml).join(''))
  it.rendered = it.logs.length
  const cnt = document.querySelector('#log-' + it.id + ' [data-logcount]')
  if (cnt) cnt.textContent = it.logs.length
}
function syncArtifacts(it) {
  const el = document.getElementById('artifacts-' + it.id)
  if (el) el.innerHTML = artifactRows(it)
}
function syncTabs(it) {
  const bar = document.getElementById('tabs-' + it.id)
  if (bar) bar.innerHTML = tabBar(it)
  for (const t of ['overview', 'clar', 'log']) {
    const sec = document.getElementById('tab-' + t + '-' + it.id)
    if (sec) sec.classList.toggle('hidden', activeTab !== t)
  }
}
function syncOverview(it) {
  const el = document.getElementById('overview-' + it.id)
  if (!el) return
  el.innerHTML = it.run === 'idle'
    ? idleBlock(it)
    : `<div class="text-[9px] uppercase tracking-[0.18em] font-bold text-slate-500 mb-1.5">Derivation run</div>
       ${stageRail(it)}`
}
function syncClar(it) {
  const body = document.getElementById('clarcontent-' + it.id)
  if (body) body.innerHTML = clarificationEntries(it)
  const cnt = document.querySelector('#clar-' + it.id + ' [data-clarcount]')
  if (cnt) cnt.textContent = (it.history || []).length
}
function syncAsk(it) {
  const el = document.getElementById('ask-' + it.id)
  if (!el) return
  const show = it.run === 'asking' && selectedId === it.id
  el.classList.toggle('hidden', !show)
  el.innerHTML = show ? questionCard(it) : ''
}
function syncPill(it) {
  const el = document.getElementById('pill-' + it.id)
  if (el) el.innerHTML = runStatePill(it)
  const dp = document.getElementById('detailPill')
  if (dp && selectedId === it.id) dp.innerHTML = runStatePill(it)
}
function syncCounts(it) {
  const c = countsOf(it)
  for (const [k, v] of Object.entries({ docs:c.docs, reqs:c.reqs, decs:c.decs, tickets:c.tickets })) {
    const el = document.getElementById(`cnt-${it.id}-${k}`)
    if (el) el.textContent = v
  }
}
function syncBanner() {
  const el = document.getElementById('bannerChips')
  if (el) el.innerHTML = bannerChips()
}
function syncDots(it) {
  const dots = document.querySelectorAll(`[data-dot="${it.id}"]`)
  if (!dots.length) return
  const cls = !it ? 'bg-slate-600'
    : it.run === 'running' ? 'bg-accentBlue animate-pulse shadow-[0_0_6px_rgba(59,130,246,0.8)]'
    : it.run === 'asking' ? 'bg-amber-400 animate-pulse shadow-[0_0_6px_rgba(245,158,11,0.8)]'
    : it.run === 'done' ? 'bg-emerald-400'
    : 'bg-slate-600'
  for (const dot of dots) dot.setAttribute('class', 'w-1.5 h-1.5 rounded-full flex-shrink-0 ' + cls)
}
function syncRow(it) {
  syncPill(it)
  syncCounts(it)
  syncBanner()
  syncDots(it)
  if (selectedId !== it.id) return
  syncAsk(it)
  syncOverview(it)
  syncLogs(it)
  syncArtifacts(it)
  syncClar(it)
  syncTabs(it)
}

// =====================================================================
// Interactions
// =====================================================================
function toggleArtifact(wiId, artId) {
  if (openChips.has(artId)) openChips.delete(artId); else openChips.add(artId)
  syncArtifacts(byId(wiId))
}
function toggleEdit(wiId, artId) {
  const key = 'edit:' + artId
  if (openChips.has(key)) openChips.delete(key); else openChips.add(key)
  if (drafts[artId] === undefined) {
    const a = flatArtifacts(byId(wiId)).find(x => x.id === artId)
    if (a) drafts[artId] = a.body
  }
  syncArtifacts(byId(wiId))
}
function saveEdit(wiId, artId) {
  const it = byId(wiId)
  const a = flatArtifacts(it).find(x => x.id === artId)
  if (a) {
    a.body = drafts[artId] !== undefined ? drafts[artId] : a.body
    a.review = 'pending'
    if (it.run === 'done') it.published = false
  }
  openChips.delete('edit:' + artId)
  syncRow(it)
}
function setReview(wiId, artId) {
  const it = byId(wiId)
  const a = flatArtifacts(it).find(x => x.id === artId)
  if (!a) return
  const next = a.auto ? 'pending' : (a.review === 'pending' ? 'approved' : 'pending')
  a.review = next
  a.auto = false
  syncRow(it)
}
function toggleFilter(code) {
  if (filters.has(code)) filters.delete(code); else filters.add(code)
  const it = byId(selectedId)
  if (it) syncArtifacts(it)
}
function clearFilters() {
  filters = new Set()
  const it = byId(selectedId)
  if (it) syncArtifacts(it)
}
function startNewWorkItem() {
  const title = newTitle.trim()
  if (!title) return
  nextSeq.wi = (nextSeq.wi || 20) + 1
  nextSeq.in = (nextSeq.in || 20) + 1
  const it = {
    id: 'WI-' + String(nextSeq.wi).padStart(3, '0'),
    seedCat: 'intents',
    seed: { id: 'INT-' + String(nextSeq.in).padStart(3, '0'), title, review: 'approved',
            body: 'Users should be able to ' + title.toLowerCase() + '.' },
    title, summary: title,
    run: 'running', stage: 0, elapsed: 0, pauses: 0, waited: 0,
    artifacts: { documentation:[], requirements:[], decisions:[], open_questions:[], tickets:[] },
    history: [], question: null, logs: [],
  }
  it.script = standardScript(it)
  items.unshift(it)
  newTitle = ''; newOpen = false
  activeTab = 'overview'
  selectedId = it.id
  render()
  timers.set(it.id, setTimeout(() => stepRun(it), 900))
}
function sendIdleToRun(id) {
  const it = byId(id)
  if (!it || it.run !== 'idle') return
  it.script = standardScript(it)
  selectedId = id
  startRun(it)
}

// =====================================================================
// Clock — patches only the delta spans. No re-render, no timeouts.
// =====================================================================
setInterval(() => {
  for (const it of items) {
    if (it.run === 'running') {
      it.elapsed++
      for (const el of document.querySelectorAll(`[data-elapsed="${it.id}"]`)) el.textContent = fmt(it.elapsed)
    } else if (it.run === 'asking') {
      it.waited = (it.waited || 0) + 1
      const w = fmt(it.waited)
      for (const el of document.querySelectorAll(`[data-waitpill="${it.id}"], [data-waitcard="${it.id}"]`)) el.textContent = w
    }
  }
}, 1000)

// =====================================================================
// Pane splitter — drag to resize; fullscreen toggle; app sidebar.
// =====================================================================
const workspace = document.getElementById('workspace')
const listPane = document.getElementById('listPane')
const splitter = document.getElementById('splitter')
const detailPane = document.getElementById('detail')
let splitDragging = false
let detailFull = false
let savedDetailW = null
let appSidebarCollapsed = false

const clampDetailW = w => {
  const box = workspace.getBoundingClientRect()
  return Math.min(Math.max(w, 300), box.width - 480)
}
function toggleDetailFull() {
  detailFull = !detailFull
  if (detailFull) {
    savedDetailW = detailPane.getBoundingClientRect().width
    listPane.style.display = 'none'
    splitter.style.display = 'none'
    detailPane.classList.add('detail-full')
  } else {
    listPane.style.display = ''
    splitter.style.display = ''
    detailPane.classList.remove('detail-full')
    detailPane.style.flex = ''
    detailPane.style.width = clampDetailW(savedDetailW != null ? savedDetailW : Math.round(workspace.getBoundingClientRect().width * 0.45)) + 'px'
  }
}
function toggleAppSidebar() {
  appSidebarCollapsed = !appSidebarCollapsed
  document.getElementById('appSidebar').classList.toggle('hidden', appSidebarCollapsed)
  document.getElementById('appRail').classList.toggle('hidden', !appSidebarCollapsed)
}
if (splitter) {
  splitter.addEventListener('pointerdown', e => {
    if (detailFull) return
    splitDragging = true
    splitter.setPointerCapture(e.pointerId)
    e.preventDefault()
  })
  splitter.addEventListener('pointermove', e => {
    if (!splitDragging) return
    const box = workspace.getBoundingClientRect()
    const w = Math.round(box.right - e.clientX)
    detailPane.style.width = clampDetailW(w) + 'px'
  })
  const endDrag = e => {
    if (!splitDragging) return
    splitDragging = false
    if (splitter.hasPointerCapture(e.pointerId)) splitter.releasePointerCapture(e.pointerId)
  }
  splitter.addEventListener('pointerup', endDrag)
  splitter.addEventListener('pointercancel', endDrag)
}

// Default split 45/55 (detail / list) from the workspace width.
detailPane.style.width = clampDetailW(Math.round(workspace.getBoundingClientRect().width * 0.45)) + 'px'

render()
items.forEach(kickoffSeededRun)
</script>
</body>
